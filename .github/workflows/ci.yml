name: Cross-platform CI (development preview, frozen npm dependencies)

# No releases, publishing, global config edits, or permission elevation.
# Node 22 + 24 on Linux x64, Windows x64, macOS Apple Silicon and macOS Intel.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
        node: ['22', '24']
    steps:
      - name: Check out source (no persisted GitHub credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Validate exact frozen lockfile BEFORE install
        run: node ci/verify-frozen-lock.mjs

      - name: Frozen clean install (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check lockfile was not changed by npm ci
        run: git diff --exit-code -- package.json package-lock.json

      - name: Record runtime and complete dependency graph
        run: |
          node --version
          npm --version
          npm ls --all

      - name: Check third-party license inventory and installed metadata
        run: node ci/audit-third-party.mjs --check-installed

      - name: Test rejection of tampered/unfrozen dependency metadata
        run: node --test ci/test-frozen-lock.mjs

      - name: TypeScript compile
        run: npm run build

      - name: Core, CLI and MCP contract tests (no SDK mocks)
        run: node ci/run-tests.mjs unit

      - name: Independent P2 golden accuracy evidence (no snapshot updates)
        run: node ci/golden-report.mjs --check

      - name: Official MCP SDK stdio E2E (required, never skipped)
        run: node ci/run-tests.mjs protocol

      - name: Validate packed CLI, Core, MCP and Skill layout
        run: node ci/verify-distribution.mjs

      - name: Build real npm tarball twice and prove byte reproducibility
        run: node ci/verify-packaging.mjs
