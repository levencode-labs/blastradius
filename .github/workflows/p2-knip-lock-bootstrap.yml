name: P2 Knip comparator lock bootstrap (no publication)

on:
  push:
    branches: [eval/p2-public-corpus-knip]
    paths:
      - .github/workflows/p2-knip-lock-bootstrap.yml
      - evaluation/public/knip-tool/package.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate comparator-only lockfile (no lifecycle)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix evaluation/public/knip-tool
      - name: Validate exact Knip package identity and SRI
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const p=JSON.parse(fs.readFileSync("evaluation/public/knip-tool/package.json"));
            const l=JSON.parse(fs.readFileSync("evaluation/public/knip-tool/package-lock.json"));
            assert.equal(l.lockfileVersion,3);
            assert.deepEqual(l.packages[""].dependencies,p.dependencies);
            assert.equal(l.packages["node_modules/knip"].version,"6.45.1");
            for(const [k,v] of Object.entries(l.packages)){
              if(!k)continue;
              assert.match(v.integrity||"",/^sha512-/);
              assert.match(v.resolved||"",/^https:\/\/registry\.npmjs\.org\//);
            }
            console.log("Knip comparator locked",Object.keys(l.packages).length-1);
          '
          sha256sum evaluation/public/knip-tool/package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: blastradius-knip-6.45.1-lock
          path: evaluation/public/knip-tool/package-lock.json
          if-no-files-found: error
          retention-days: 10
